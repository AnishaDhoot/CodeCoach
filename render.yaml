# Render blueprint — FREE FastAPI backend (web service on Render's free plan).
#
# Database: Render's own free Postgres EXPIRES after 30 days, so this blueprint
# does NOT provision one. Use a persistent free Postgres from Neon
# (https://neon.tech) instead, and paste its connection string as the
# DATABASE_URL secret in the Render dashboard after the first sync.
#
# Deploy: push this repo, then Render → "New +" → "Blueprint" and pick it.
# Then set the `sync: false` secrets (DATABASE_URL, GROQ_API_KEY) in the dashboard.
#
# Free-plan caveats: the service sleeps after ~15 min idle and cold-starts on the
# next request; migrations run at boot (free plan has no pre-deploy command), which
# is safe because there is only ever one free instance.
services:
  - type: web
    name: codecoach-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL        # paste your Neon connection string (starts with postgresql://)
        sync: false
      - key: RUN_MIGRATIONS      # entrypoint runs `alembic upgrade head` on boot (single free instance)
        value: "1"
      - key: SEED_ON_START       # seed the problem catalog on boot (idempotent, non-destructive)
        value: "1"
      # SEED_SKIP_GITHUB unset -> the FIRST boot fetches rich per-company question
      # lists from GitHub (so company filtering has real data). Subsequent boots
      # short-circuit once the catalog is seeded (>=300 problems), so they stay fast.
      # Set SEED_SKIP_GITHUB=1 if the first-boot GitHub fetch is unreliable in your region.
      - key: WEB_CONCURRENCY     # 1 worker fits the free plan's memory
        value: "1"
      - key: AI_DAILY_QUOTA_LIMIT
        value: "50"
      - key: GROQ_MODEL
        value: "openai/gpt-oss-20b"
      - key: GROQ_API_KEY        # set in dashboard; never commit
        sync: false
      - key: EXTRA_CORS_ORIGINS  # optional extra web origins, comma-separated
        sync: false
      - key: CHROME_EXTENSION_ID # optional; pin CORS to your published extension id
        sync: false
